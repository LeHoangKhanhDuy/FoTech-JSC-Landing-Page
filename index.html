    <script>
      (function () {
        var isFoHRM = window.location.pathname.startsWith("/app/fohrm");
        if (isFoHRM) {
          document.documentElement.classList.add("dark");
          return;
        }
        if (window.location.pathname.startsWith("/app/fomed")) {
          if (localStorage.getItem("fomed-theme") === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          return;
        }
        var stored =
          localStorage.getItem("fotech-theme") || localStorage.getItem("fotalent-theme");
        if (stored === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
